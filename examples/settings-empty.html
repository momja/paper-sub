<style>
  body { background: #fbfbfc; font-family: ui-sans-serif, system-ui, sans-serif; color: #14161a; }

  main { padding: 30px 34px; }
  h1 { font-size: 20px; letter-spacing: -0.02em; margin: 0 0 3px; font-weight: 640; }
  .sub { font-size: 13px; color: #767c86; margin: 0 0 26px; }
  .empty { border: 1px dashed #dcdee3; border-radius: 12px; padding: 52px 30px; text-align: center; background: #fff; }
  .empty .glyph { width: 42px; height: 42px; border-radius: 11px; background: #f1f1f4; margin: 0 auto 15px; display: grid; place-items: center; font-size: 19px; }

    <nav>

      <a href="#">Audit log</a>
    </nav>
